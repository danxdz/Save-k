[package]
name = "savek-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Experimental local-first Save-K Windows library browser"

[dependencies]
savek-core = { path = "../savek-core" }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.15.3"
dirs = "6.0"
opener = "0.8.5"
image = { version = "0.25.5", default-features = false, features = ["jpeg", "png", "bmp", "webp", "gif", "tiff"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

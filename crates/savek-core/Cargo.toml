[package]
name = "savek-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Read-only source indexing primitives for Save-K"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1.8"
image = { version = "0.25.5", default-features = false, features = ["jpeg", "png", "bmp", "webp", "gif", "tiff"] }
